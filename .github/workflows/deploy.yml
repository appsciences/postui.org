name: Deploy to Firebase Hosting (live)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two live deploys race; a newer commit supersedes an in-flight one,
# but we let the running deploy finish so the site is never left half-published.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  check:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pre-deploy site checks
        run: node scripts/check-site.mjs

  deploy:
    name: Deploy to live channel
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POSTUI_ORG }}
          projectId: postui-org
          channelId: live
